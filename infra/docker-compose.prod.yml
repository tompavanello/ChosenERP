# Chosen ERP - override de PRODUCAO (VPS unica self-hosted).
#
# Uso:
#   docker compose --env-file .env \
#     -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
#
# O que muda em relacao ao arquivo base:
#   * portas internas ficam acessiveis apenas em 127.0.0.1 (o trafego publico
#     entra pelo Cloudflare Tunnel -> nginx). Nada de Postgres/Evolution expostos.
#   * Postgres com tuning para um servidor de 16 GB (ajustavel por env).
#   * nginx continua na porta 80 (necessario para o cloudflared que roda no host
#     ou na rede do Compose).
#
# Os healthchecks/restart/log rotation vivem no arquivo base e valem aqui.

name: chosen-erp

services:
  postgres:
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-4GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-12GB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-512MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-200}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-4GB}
      - -c
      - checkpoint_completion_target=${PG_CHECKPOINT_COMPLETION_TARGET:-0.9}
      - -c
      - wal_compression=on
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-35432}:5432"

  evolution:
    ports: !override
      - "127.0.0.1:${EVOLUTION_PORT:-38081}:8080"

  api:
    ports: !override
      - "127.0.0.1:${API_HTTP_PORT:-38080}:8080"

  webadmin:
    ports: !override
      - "127.0.0.1:${WEBADMIN_PORT:-33000}:33000"

  marketing:
    ports: !override
      - "127.0.0.1:${MARKETING_PORT:-33010}:33000"

  member:
    ports: !override
      - "127.0.0.1:${MEMBER_PORT:-33020}:33000"

  nginx:
    ports: !override
      - "${NGINX_HTTP_PORT:-80}:80"
