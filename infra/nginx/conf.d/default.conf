# =============================================================================
# Site institucional no dominio central (apex + www).
# O painel vive nos subdominios de igreja e em app.erpchosen.com.br (bloco 2).
# Blocos com server_name EXATO tem prioridade sobre o regex do bloco 2, entao o
# apex cai aqui e os subdominios continuam no webadmin (white-label).
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name erpchosen.com.br
                www.erpchosen.com.br
                chosenerp.mgmconsultoria.com
                www.chosenerp.mgmconsultoria.com;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    client_max_body_size 50M;

    location / {
        proxy_pass http://marketing_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /healthz {
        proxy_pass http://api_backend/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://api_backend/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # O formulario de contato do site chama POST /api/v1/public/leads.
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api_backend/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /assets/ {
        proxy_pass http://api_backend/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

# =============================================================================
# Painel (webadmin) + QUALQUER subdominio de igreja (white-label). O regex
# captura o slug do subdominio em $slug e o repassa como X-Tenant-Slug, que a
# API usa para resolver a igreja ativa quando o token nao a fixa. O Cloudflare
# deve ter o registro wildcard (DNS) e o TLS wildcard `*.dominio`.
# `app`, `www`, `api` e `admin` sao subtraidos no proprio app (RESERVED_SLUGS).
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<slug>[a-z0-9-]+)\.(?:erpchosen\.com\.br|chosenerp\.mgmconsultoria\.com)$;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    client_max_body_size 50M;

    location / {
        proxy_pass http://webadmin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Slug $slug;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /healthz {
        proxy_pass http://api_backend/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://api_backend/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Slug $slug;
    }

    location /uploads/ {
        proxy_pass http://api_backend/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /assets/ {
        proxy_pass http://api_backend/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
