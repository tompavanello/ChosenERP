# Chosen ERP - Infraestrutura local (Docker Compose)
# Sobe: PostgreSQL 17, Redis, RabbitMQ + Observabilidade (Prometheus/Grafana)

name: chosen-erp

services:
  postgres:
    image: postgres:17-alpine
    container_name: chosen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sinc}
      POSTGRES_DB: chosenerp
    ports:
      - "${POSTGRES_PORT:-35432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chosenerp"]
      interval: 5s
      timeout: 5s
      retries: 10

  ### Evolution API (WhatsApp) - backend dos canais por filial (QR Code).
  ### Banco próprio (`evolution`) no mesmo Postgres; instancias em volume nomeado.
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: chosen-evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-chosen-evolution-key}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:${POSTGRES_PASSWORD:-sinc}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: chosen_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      LANGUAGE: pt-BR
      LOG_LEVEL: ${EVOLUTION_LOG_LEVEL:-ERROR}
      LOG_BAILEYS: ${EVOLUTION_LOG_BAILEYS:-error}
      QRCODE_LIMIT: "30"
      CONFIG_SESSION_PHONE_CLIENT: Chosen ERP
      CONFIG_SESSION_PHONE_NAME: Chrome
      # Vazio => o Baileys busca a versao mais recente do WhatsApp Web.
      CONFIG_SESSION_PHONE_VERSION: ${EVOLUTION_PHONE_VERSION:-}
      SERVER_URL: http://evolution:8080
      DEL_INSTANCE: "false"
    ports:
      - "${EVOLUTION_PORT:-38081}:8080"
    volumes:
      - evolution_instances:/evolution/instances

  ### Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: chosen-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      webadmin:
        condition: service_started
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - uploads:/uploads

  ### Cloudflare Tunnel EXCLUSIVO do dominio erpchosen.com.br (white-label).
  ### Sobe com o profile `erpchosen`. Usa o config/credenciais gerados por
  ### `cloudflared tunnel create` (ver infra/cloudflare/). Roteia para o nginx,
  ### que faz o split /api e repassa X-Tenant-Slug conforme o subdominio.
  cloudflared-erpchosen:
    image: cloudflare/cloudflared:latest
    container_name: chosen-cloudflared-erpchosen
    restart: unless-stopped
    profiles: ["erpchosen"]
    depends_on:
      nginx:
        condition: service_started
    volumes:
      - ./cloudflare/config-erpchosen.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflare/erpchosen-creds.json:/etc/cloudflared/creds.json:ro
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run

  ### Chosen ERP API (Go) - monolito modular
  api:
    build:
      context: ..
      dockerfile: infra/api/Dockerfile
    image: chosenerp/api:local
    container_name: chosen-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      evolution:
        condition: service_started
    environment:
      DATABASE_URL: postgres://chosenerp_app:chosenapp@postgres:5432/chosenerp?sslmode=disable
      MIGRATE_DATABASE_URL: postgres://postgres:sinc@postgres:5432/chosenerp?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      API_HTTP_PORT: "8080"
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:38080}
      UPLOAD_DIR: /uploads
      MEMBER_PHOTO_MAX_KB: ${MEMBER_PHOTO_MAX_KB:-5120}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Chosen ERP}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v19.0}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-meta}
      # Dentro da rede do Compose a Evolution atende em http://evolution:8080.
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-chosen-evolution-key}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
      PUBLIC_BASE_DOMAIN: ${PUBLIC_BASE_DOMAIN:-erpchosen.com.br}
      DELIVERY_POLL_SECONDS: ${DELIVERY_POLL_SECONDS:-30}
      RECURRING_POLL_SECONDS: ${RECURRING_POLL_SECONDS:-3600}
    ports:
      - "${API_HTTP_PORT:-38080}:8080"
    volumes:
      # Volume NOMEADO (e nao tmpfs): anexos e fotos de membro precisam
      # sobreviver ao restart do container. Como tmpfs, todo `docker compose
      # down/up` apagava as imagens e o banco continuava apontando para URLs
      # mortas, sem nenhum erro visivel na tela.
      - uploads:/uploads

  ### Webadmin (Next.js 15) - UI do ERP. Build standalone; sobe junto com o stack.
  webadmin:
    build:
      context: ../apps/webadmin
      dockerfile: Dockerfile
      args:
        # Lido pelo rewrites() do next.config.ts em tempo de build. Na rede do
        # Compose a API e "api:8080" (nao localhost:38080).
        API_ORIGIN: http://api:8080
        # Dominio base para o subdominio por igreja (white-label).
        NEXT_PUBLIC_BASE_DOMAIN: ${PUBLIC_BASE_DOMAIN:-erpchosen.com.br}
    image: chosenerp/webadmin:local
    container_name: chosen-webadmin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      API_ORIGIN: http://api:8080
    ports:
      - "${WEBADMIN_PORT:-33000}:33000"

  redis:
    image: redis:7-alpine
    container_name: chosen-redis
    restart: unless-stopped
    profiles: ["full"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-36379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: chosen-rabbitmq
    restart: unless-stopped
    profiles: ["full"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-chosen}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-chosen}
    ports:
      - "${RABBITMQ_PORT:-35672}:5672"
      - "${RABBITMQ_MGMT_PORT:-31572}:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: chosen-prometheus
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "${PROMETHEUS_PORT:-39090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: chosen-grafana
    restart: unless-stopped
    profiles: ["full"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-admin}
    ports:
      - "${GRAFANA_PORT:-33001}:3000"
    volumes:
      - grafanadata:/var/lib/grafana

volumes:
  # Anexos do financeiro e fotos de membro (UPLOAD_DIR=/uploads na API).
  uploads:
  pgdata:
  # Sessoes/credenciais das instancias WhatsApp da Evolution API.
  evolution_instances:
  redisdata:
  rabbitdata:
  promdata:
  grafanadata: