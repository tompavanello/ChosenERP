name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  go:
    name: Go (build, vet, testes de RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # O harness dos testes cria/recria o banco descartável `chosenerp_test`
      # a partir do DSN do migrador e roda db/init/setup.sql (que cria o papel
      # chosenerp_app) antes das migrações.
      CHOSEN_TEST_MIGRATE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      CHOSEN_TEST_APP_URL: postgres://chosenerp_app:chosenapp@localhost:5432/postgres?sslmode=disable
      # Falha em vez de pular quando os DSNs não existem.
      CHOSEN_TESTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1

  webadmin:
    name: Webadmin (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/webadmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/webadmin/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
